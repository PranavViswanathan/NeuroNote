services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: neuronote-postgres-ext:16
    environment:
      POSTGRES_DB: neuronote
      POSTGRES_USER: neuronote
      POSTGRES_PASSWORD: neuronote
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - neuronote-db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronote -d neuronote"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    image: neuronote-api:dev
    working_dir: /app
    command:
      [
        "uv",
        "run",
        "--project",
        "api",
        "--group",
        "dev",
        "uvicorn",
        "app.main:app",
        "--app-dir",
        "api/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ..:/app
      - uv-cache:/tmp/uv-cache
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://neuronote:neuronote@db:5432/neuronote
      REQUIRE_DB_EXTENSIONS: "false"
      DB_AUTO_CREATE: "false"
      NLP_MODEL_NAME: ${NLP_MODEL_NAME:-rule-based-small}
      NLP_EXTRACTION_PROFILE: ${NLP_EXTRACTION_PROFILE:-rule-only}
      NLP_ENABLE_REGEX_FALLBACK: ${NLP_ENABLE_REGEX_FALLBACK:-true}
      NLP_ENTITY_SEED_TERMS: ${NLP_ENTITY_SEED_TERMS:-machine learning,entity resolution,graph reasoning,knowledge graph,neural networks}
      UV_PROJECT_ENVIRONMENT: /tmp/neuronote-api-venv
      UV_CACHE_DIR: /tmp/uv-cache
      PYTHONPATH: api/src:.
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20
    working_dir: /app/web
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ..:/app
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      - api

volumes:
  neuronote-db-data:
  uv-cache:
