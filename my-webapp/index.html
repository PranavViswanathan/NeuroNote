<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/my-webapp/style.css">
    <title>NeuroNote</title>
</head>

<body>
    <div id="page-container">
      <div id="page-header">
        <div id="page-title">NeuroNote</div>
        <div id="page-selector">
          <label for="page-select">Select a page:</label>
          <select id="page-select">
            <!-- Page options will be added here dynamically -->
          </select>
          <button id="add-page-button">Add Page</button>
        </div>
      </div>
      
      <div id="sidebar">
        <!-- Sidebar content will go here -->
      </div>
      <div id="main-content">
        <div id="page-title"></div>
        <div id="block-container"></div>
        <button id="prev-button">Previous</button>
        <button id="next-button">Next</button>
        <div id="block-editor">
          <label for="block-name-input">Block Name:</label>
          <input id="block-name-input" type="text">
          <label for="block-text-input">Block Text:</label>
          <textarea id="block-text-input"></textarea>
          <button id="add-block-button">Add Block</button>
        </div>
      </div>
    </div>
  </body>

  </html>
